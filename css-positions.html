<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Document</title>
    <link
      rel="stylesheet"
      href="css-positions.css"
    />
  </head>
  <body>
    <!-- 
        RELATIVE

        1. Akan berpindah terhadap posisi semula
        2. Ketika berpindah, akan meninggalkan celah kosong
        3. Untuk dapat menggunakan position relative, diharuskan untuk menggunakan salah 1 property yaitu top, right, bottom, left
    -->
    <div id="container">
      <div>Box-01</div>
      <div id="box-02">Box-02</div>
      <div>Box-03</div>
    </div>
    <br />
    <br />
    <br />
    <br />
    <br />
    <!-- 
        ABSOLUTE

        1. Akan berpindah terhadap parent nya yg memiliki position non-static
        2. Ketika tidak ada parent yg memiliki position non-static, akan berpindah terhadap viewport
        3. Ketika berpindah, tidak meninggalkan celah kosong
        4. Untuk dapat menggunakan position absolute, diharuskan untuk menggunakan salah 1 property yaitu top, right, bottom, left
    -->
    <div id="wrapper">
      <div>Box-01</div>
      <div id="box-02">Box-02</div>
      <div>Box-03</div>
    </div>

    <div id="product">
      <img
        src="https://ik.imagekit.io/dcjlghyytp1/87e5d82df585d892273a762b7d74afde?tr=f-auto,w-360"
      />
      <p style="font-size: 18px; color: red">20%</p>
    </div>
    <br />
    <br />
    <br />
    <br />
    <br />
    <!-- 
        FIXED

        1. Relatif terhadap viewport
    -->
    <div id="navbar">Navbar</div>
  </body>
</html>
