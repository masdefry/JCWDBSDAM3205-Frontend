<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="flexbox.css">
</head>
<body>
    <!-- 
        FLEXBOX

        1. Mengatur tata letak
        2. Harus punya container dengan display: flex
        3. Property:
            - display           : flex
            - flex-direction    : Mengatur direction row/column
            - justify-content   : Mengatur item secara horizontal
            - align-items       : Mengatur item secara vertical
            - gap               : Mengatur jarak antar item
            - flex-wrap         : Wrap item (jika viewport tidak mencukupi, akan buat baris baru dibawahnya)

    -->
    <div id="container">
        <div>1</div>
        <div>2</div>
        <div>3</div>
    </div>

    <div id="parent">
        <div>1</div>
        <div>2</div>
        <div>3</div>
    </div>
</body>
</html>
