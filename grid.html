<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Document</title>
    <link
      rel="stylesheet"
      href="grid.css"
    />
  </head>
  <body>
    <!-- 
        GRID

        1. Mengatur tata letak secara baris maupun kolom
        2. Syarat menggunakan grid yaitu: 
            - Harus ada parent nya
            - Harus ada item child nya
        3. Untuk menggunakan grid, harus di define: display: grid
        4. Property grid yang bisa digunakan:
            - grid-template-column  : Untuk mendefiniskan jumlah kolom
            - grid-template-row     : Untuk mendefinisikan jumlah baris
            - gap                   : Untuk memberikan jarak antar item
            - grid-column           : Untuk menentukan posisi dan rentang kolom
            - grid-row              : Untuk menentukan posisi dan rentang baris
    -->
    <div id="container">
      <div id="child-1">1</div>
      <div id="child-2">2</div>
      <div>3</div>
      <div>4</div>
      <div>5</div>
      <div>6</div>
      <div>7</div>
      <div>8</div>
      <div>9</div>
      <div>10</div>
      <div>11</div>
    </div>
  </body>
</html>
